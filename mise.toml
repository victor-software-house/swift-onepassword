# The latest stable mise is the floor; CI pins the same version.
min_version = "2026.11.12"

[settings]
# Every tool comes from the locks, whether a config file, a task or the command
# line needs it. A tool with no entry fails instead of being looked up.
locked = true
# mise loads git:: task includes, and runs [deps] providers, only in
# experimental mode.
experimental = true
lockfile = true
# The platforms CI and contributors use, from the platforms answer. Without
# it, mise install fills every tool up to the platforms any tool already
# records, and rewrites the locks.
lockfile_platforms = ["linux-x64", "macos-arm64"]

# Every tool this root declares must match mise.lock or mise.<env>.lock.
[tool_config]
locked = true

[env]
# swift:docs builds the documentation of these targets.
SWIFT_DOC_TARGETS = "OnePassword"
# specs:budget reads the word budget of each file kind from here.
OPENSPEC_BUDGETS = "proposal=600 design=2500 tasks=1500 note=60 spec=1200 research=2500"

# The one gate CI runs, composed from the pieces this repository keeps.
# To change one step, define a task of the same name below, such as swift:test,
# which wins over the catalog's. A check of the repository's own goes in check:local.
[tasks.check]
description = "Every check this package runs"
depends = [
  "xcframework:check",
  "xcframework:test",
  "swift:build",
  "swift:test",
  "swift:lint",
  "swift:docs",
  "swift:api",
  "release:check",
  "check:repo",
]

# verctl's release workflow plans only on the default branch. This runs the same
# served ver task in every CI run, so a release setup it cannot read fails before
# a merge.
[tasks."release:check"]
description = "verctl reads the release config and every pending fragment"
run = ["mise run --quiet ver check", "mise run --quiet ver status"]

# mise-tasks/ contains this repository's task fragments and file tasks.
# An includes list replaces the default task dirs, so mise-tasks comes first.
# Add pinned git:: catalogs after it.
[task_config]
includes = [
  # Pinned git:: catalogs follow mise-tasks.
  "mise-tasks",
  # specs:budget, from the tasks-specs package at its digest.
  """oci::ghcr.io/victor-software-house/tasks-specs@sha256:\
    9dbe200899e239236d98a88416e1c78fe60e7d06343bc40fa52665e8f7102f0e""",
  # The shared Swift tasks, at actions main, 2026-11-26.
  "git::https://github.com/victor-software-house/actions.git//tasks/swift.toml?ref=e9cf7ef0da4f4a9a7a6f978f5dd54be0d0d539bc",
  # The ver task (verctl v0.8.5), which the release workflow runs.
  "git::https://github.com/victor-software-house/verctl.git//tasks/ver?ref=cef779a4ed2ce4705fd25c6ea17a5454d2522adc",
  # template:check, template:off, and template:on, at actions main, 2026-11-26.
  "git::https://github.com/victor-software-house/actions.git//tasks/template.toml?ref=e9cf7ef0da4f4a9a7a6f978f5dd54be0d0d539bc",
  # The q task (qctl v0.7.0), pinned by commit because a tag can move.
  "git::https://github.com/victor-software-house/qctl.git//tasks/q?ref=ea9e838d7af20683930156dee9fdf16cebee5fcb",
]

# Swift and the C toolchain come from the selected Xcode, which macOS runners and the box hosts carry.
[tools]
# The Go toolchain of bench:go and of the xcframework:test override below.
# The xcframework:* file tasks declare their own go and gh.
go = "1.27.4"

[tasks.build]
description = "Build the Swift package"
run = "swift build"

[tasks.test]
description = "Run the Swift package tests"
run = "swift test"

# The live task runs LiveTests, once, and posts their timings.
# The memory test reads the resident size of the whole process, so it runs alone.
# Other suites run beside it in one process and raise that size by tens of megabytes.
[tasks."swift:test"]
description = "Run the package tests but the live ones, then the memory test alone"
run = [
  "swift test --skip LiveTests --skip aLongLivedClientKeepsItsMemory",
  "swift test --filter aLongLivedClientKeepsItsMemory",
]

# Replaces the go_xcframework piece's file task of the same name.
# The race detector adds its own memory to the resident size, so the memory
# test runs alone, without it.
[tasks."xcframework:test"]
description = "Run the Go tests of core/ with the race detector, then the memory test alone"
dir = "{{config_root}}/core"
run = [
  "go test -race -skip '^TestLongLivedClientMemory$' ./...",
  "go test -run '^TestLongLivedClientMemory$' ./...",
]
