    outcome: aLongLivedClientKeepsItsMemory fails only on a real leak.
    blocked_by: []
    acceptance:
      - Ten CI runs of main pass the test, each reporting growth under 1 MiB.
    notes:
      - '2026-11-18, in 8 CI runs a start near 201 to 211 MiB grew 0.2 MiB, and a start near 214 MiB grew 7 to 38 MiB; the merge group of #14 failed at 38.3 MiB.'
