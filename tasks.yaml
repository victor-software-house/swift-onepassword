  - id: S1P-002
    title: Measure the long-lived client memory test alone
    scope: tests
    outcome: aLongLivedClientKeepsItsMemory fails only on a real leak.
    notes:
      - '2026-11-18, in 8 CI runs a start near 201 to 211 MiB grew 0.2 MiB, and a start near 214 MiB grew 7 to 38 MiB; the merge group of #14 failed at 38.3 MiB.'
      - '2026-11-19 UTC: run alone in its own process since #25, nine main runs grew 0.1 to 0.5 MiB from starts of 193 to 206 MiB, and run 44576782041 grew 13.8 MiB from a start of 209.4 MiB, so the parallel suites were not the cause.'
      - '2026-11-19 UTC: with the size logged per hundred calls, main run 44580772494 grew 14.8 MiB in its first hundred calls, then 1.3 MiB over the next 900, and 0.1 MiB over the last 500; run 44580044090 grew 0.3 MiB, then 0.1 MiB.'
    completed: 2026-11-19T18:49:39
    evidence:
      - '2026-11-19 UTC: since #28, ten main runs passed, 44584362012, 44585194269, 44585948943, 44586963878, 44587814397, 44588562772, 44589118798, 44589946796, 44590584311 and 44591219314.'
      - Each grew 0.0 to 0.1 MiB over its last 500 calls; the whole loop grew 0.0 to 0.6 MiB in eight runs, and 8.3 MiB and 26.7 MiB in the two runs whose core grew early.
      - Run 44590584311 grew in two steps, 14.9 MiB in its first hundred calls and 11.1 MiB in the next; a run over the 32 MiB whole-loop bound with no late growth means raising that bound, not a leak.
    disposition: completed

