# swift-onepassword's version is the VERSION file.
# With publisher none, verctl releases it on GitHub only.
# The Swift package manager reads the version from the tag.
# core.yml makes the core-* releases of the binary under the package, and verctl never reads them.
packages:
  - name: swift-onepassword
    path: VERSION
    publisher: none

# Maintainers and Apps a changelog never credits.
changelog:
  internal_authors:
    - any-victor
    - "github-actions[bot]"
    - "vsh-changeset-version[bot]"
