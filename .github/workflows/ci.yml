name: CI

on:
  # A draft pull request runs nothing; marking it ready starts the run.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # .miserc.toml loads the dev profile, the git hooks and their scanners, for local work only.
  MISE_ENV: ci

concurrency:
  # One run per pull request: a new push cancels the run it replaces.
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  package:
    if: ${{ !github.event.pull_request.draft }}
    name: Swift package (macOS)
    # GitHub-hosted macOS 27 with Xcode 27, whose Swift 6.4 builds the package. The package links
    # the macOS Security framework, so there is no Linux job.
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # mise.toml's min_version; the action otherwise takes the newest release older than 24 h.
          version: 2026.11.6
      - run: xcodebuild -version
      - run: mise run check

  live:
    # A pull request from a fork has no secrets, so the tests skip there.
    if: ${{ !github.event.pull_request.draft }}
    name: Live 1Password (macOS)
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.11.6
      - name: Read the test vault
        env:
          OP_TEST_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TEST_SERVICE_ACCOUNT_TOKEN }}
        run: mise run live
      - name: Post the timings
        if: ${{ !cancelled() }}
        run: |
          if [ -f build/live-report.md ]; then
            { echo '## Live calls'; echo; cat build/live-report.md; } >> "$GITHUB_STEP_SUMMARY"
          fi
