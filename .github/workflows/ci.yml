name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  merge_group:
  # Refresh the default branch's build cache without repeating every push.
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

# Each job declares the permissions it needs.
permissions:
  contents: read

concurrency:
  # Every merge queue entry shares one group.
  # A newer entry's run therefore cancels the runs of the entries ahead of it.
  # The queue merges on the result of the newest entry, whose merge-group
  # commit contains every entry ahead of it.
  #
  # That works only while the queue groups HEADGREEN. Under ALLGREEN, a
  # cancelled entry fails.
  # Outside the queue, a draft run gets a group of its own, so it never cancels
  # the ready run.
  group: >-
    ci-${{ github.workflow }}-${{ github.event_name == 'merge_group' && format('queue-{0}',
    github.event.merge_group.base_ref) || format('{0}-{1}{2}', github.event_name,
    github.event.pull_request.number || github.ref_name, github.event.pull_request.draft && '-draft'
    || '') }}
  cancel-in-progress: true

env:
  # Tests that create git repositories get main as their first branch,
  # whatever the runner image's git defaults to.
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # The CI profile; local work loads dev from .miserc.toml, which CI never does.
  MISE_ENV: ci

jobs:
  refresh:
    if: github.event_name == 'schedule'
    # One API call on the runner chosen when this repository was rendered.
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Dispatch CI on the default branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          WORKFLOW: ${{ github.workflow_ref }}
        run: |
          workflow=${WORKFLOW%@*}
          gh workflow run "${workflow##*/}" --repo "$REPOSITORY" --ref main

  # Whether a pull request changes anything the build reads. Documentation is
  # the root's Markdown files, docs/, and openspec/. A documentation file
  # still counts as a build input when a Swift source names its path.
  changes:
    name: Changes
    # It runs on a pull request and a merge group.
    # A merge group compares its head with its base, so a group of
    # documentation-only pull requests skips the build in the queue too.
    if: >-
      ${{ !github.event.pull_request.draft && github.event_name != 'push'
      && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # A merge group diffs with git from its base commit.
          # A job with no credentials cannot fetch that commit later in a
          # private repository, so its checkout takes the whole history.
          # The '0' is a string, so the || does not drop it.
          fetch-depth: ${{ github.event_name == 'merge_group' && '0' || '1' }}
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          list-files: json
          filters: |
            all:
              - '**'
            docs:
              - '*.md'
              - 'docs/**'
              - 'openspec/**'
      - name: Decide whether to build
        id: scope
        shell: bash
        env:
          ALL: ${{ steps.filter.outputs.all_count }}
          DOCS: ${{ steps.filter.outputs.docs_count }}
          DOCS_FILES: ${{ steps.filter.outputs.docs_files }}
        run: |
          build=false
          if [ "$ALL" != "$DOCS" ]; then
            build=true
          else
            while IFS= read -r file; do
              # A source spells the file's path from the root, as a test run
              # there does, or a relative path that climbs to the root and ends
              # in it.
              if git grep -qF -e "/$file\"" -e "\"$file\"" -e "\"./$file\"" -- '*.swift'; then
                echo "A source reads $file, so the build reads it."
                build=true
                break
              fi
            done < <(jq -r '.[]' <<<"$DOCS_FILES")
          fi
          echo "build=$build" >>"$GITHUB_OUTPUT"

  build:
    name: Build and test
    needs: changes
    # A documentation-only pull request or merge group skips the build.
    # The Changes job is skipped on a push and a dispatch, and its output is
    # then empty. The build therefore runs there, and when Changes itself
    # failed.
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && needs.changes.outputs.build != 'false' && github.event_name != 'schedule' }}
    runs-on: xcode-27
    timeout-minutes: 45
    outputs:
      cache-saved: >-
        ${{ steps.cache_save.outcome == 'success' }}
    permissions:
      contents: read
      # A check:versions task reads a pull request that changes a manifest
      # version, to tell a version pull request apart from a hand edit.
      pull-requests: read
      # The mise action exchanges the job's token for the release mirror's.
      id-token: write
    steps:
      - name: Check out repository
        timeout-minutes: 3
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install locked tools
        timeout-minutes: 5
        uses: victor-software-house/actions/mise@6243d0aec17b8d3eb664b6cf5162bfb5ef7990c3 # main, 2026-11-18
        with:
          mirror-url: ${{ secrets.RELEASE_MIRROR_URL }}
          mirror-key: ${{ secrets.RELEASE_MIRROR_CI_KEY }}
          version: 2026.11.10
          # Only a run on the default branch writes the tools cache, as with
          # the build caches below.
          # A pull request or a merge group adds no entry of its own.
          cache_save: >-
            ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
      # The key names the toolchain: the Swift of the runner's Xcode on macOS,
      # or the one mise installs. The first line of swift --version carries the
      # compiler's build, so a cache never crosses toolchains.
      - name: Read the Swift version
        id: toolchain
        shell: bash
        env:
          MANIFESTS: ${{ hashFiles('**/Package.swift', '**/Package.resolved', '!.build/**') }}
        run: |
          version=$(mise x -- swift --version 2>&1 | head -n 1 | tr -c 'A-Za-z0-9.' '-')
          {
            echo "version=$version"
            echo "prefix=swift-$RUNNER_OS-$RUNNER_ARCH-$version-"
            echo "manifests=$MANIFESTS"
          } >>"$GITHUB_OUTPUT"
      # .build contains the dependency checkouts and the build products.
      # The shared cache of SwiftPM contains the repositories and manifests it
      # clones, under ~/Library/Caches on macOS and ~/.cache on Linux.
      #
      # The key hashes the package manifests and resolved versions, leaving out
      # .build, whose checkouts contain manifests of their own.
      # The key ends in the run. A run on the default branch saves a fresh
      # entry. Every run restores the newest entry, with the same manifests
      # first and any manifests after that.
      - name: Restore the SwiftPM and build caches
        id: cache
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: "${{ steps.toolchain.outputs.prefix }}${{ steps.toolchain.outputs.manifests }}-\
            ${{ github.run_id }}-${{ github.run_attempt }}"
          restore-keys: |
            ${{ steps.toolchain.outputs.prefix }}${{ steps.toolchain.outputs.manifests }}-
            ${{ steps.toolchain.outputs.prefix }}
      - name: Run check
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OP_TEST_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TEST_SERVICE_ACCOUNT_TOKEN }}
        run: mise run check
      - name: Run live
        timeout-minutes: 15
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OP_TEST_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_TEST_SERVICE_ACCOUNT_TOKEN }}
        run: mise run live
      # Only a run on the default branch saves.
      # A pull request, a merge group and a run on another branch restore and
      # never write. No entry that another run restores therefore comes from
      # unreviewed code.
      #
      # A merge group's entry sits on its own branch, which no pull request
      # restores from. A repository that lands through a merge queue has no
      # push run. Its daily refresh therefore dispatches CI on the default
      # branch.
      #
      # The key is the one the restore computed: hashing the manifests again
      # here would also read the checkouts the build left in .build.
      - name: Save the SwiftPM and build caches
        id: cache_save
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
            ~/.cache/org.swift.swiftpm
          key: ${{ steps.cache.outputs.cache-primary-key }}

  # Each cache key ends in the run.
  # A run on the default branch that saved therefore leaves one entry of each
  # cache. This job deletes the older ones, newest kept.
  #
  # Only a run on the default branch saves, so cache-saved is true only there.
  # Only such a run needs the permission to delete.
  # Changes skips on a dispatch and on the daily refresh, the runs that save.
  # !cancelled() keeps that skip from skipping this job too.
  prune:
    name: Prune superseded caches
    needs: build
    if: >-
      ${{ !cancelled() && !github.event.pull_request.draft
      && needs.build.outputs.cache-saved == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 3
    permissions:
      actions: write
    steps:
      - name: Delete the superseded entries
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for prefix in swift-; do
            gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$prefix" \
              --limit 100 --json id,createdAt --jq 'sort_by(.createdAt) | reverse | .[1:][].id' |
              while IFS= read -r id; do
                gh cache delete "$id" --repo "$GITHUB_REPOSITORY"
              done
          done

  # The one check a ruleset requires: it reports on every pull request and
  # merge queue run, and fails when the build failed or was cancelled. A build
  # skipped by its own condition, a documentation-only pull request, counts as
  # passing.
  verify:
    name: Verify
    needs: [changes, build]
    if: ${{ always() && !github.event.pull_request.draft && github.event_name != 'schedule' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    # Reads this run and its newer runs.
    permissions:
      actions: read
    steps:
      - uses: victor-software-house/actions/verify-jobs@6243d0aec17b8d3eb664b6cf5162bfb5ef7990c3 # main, 2026-11-18
        with:
          needs: ${{ toJSON(needs) }}
          jobs: build
