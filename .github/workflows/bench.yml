name: Benchmarks

# Times the Go shim and the Swift module on a GitHub-hosted macOS runner, posts the numbers in the
# job summary, and fails when a Swift benchmark is worse than its threshold in Benchmarks/Thresholds.
# Those thresholds are the p90 of each benchmark on this runner type. The Swift benchmarks run once.
# A failed check runs them again to write new thresholds, uploaded as the thresholds artifact, to
# commit under Benchmarks/Thresholds when a change makes a benchmark slower on purpose.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - core/**
      - Sources/**
      - Package.swift
      - Benchmarks/**
      - Tests/OnePasswordTests/Fixtures/**
      - mise-tasks/bench/**
      - .github/workflows/bench.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # .miserc.toml loads the dev profile, the git hooks and their scanners, for local work only.
  MISE_ENV: ci

concurrency:
  # One run per pull request: a new push cancels the run it replaces.
  group: bench-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  bench:
    if: ${{ !github.event.pull_request.draft }}
    name: Benchmarks (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # mise.toml's min_version; the action otherwise takes the newest release older than 24 h.
          version: 2026.11.6
      - run: xcodebuild -version
      - name: Run the Go benchmarks
        shell: bash
        run: mise run bench:go | tee go-bench.txt
      - name: Run the Swift benchmarks
        run: mise run bench:swift check --no-progress
      - name: Post the numbers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '## Go benchmarks'
            echo
            echo '```text'
            cat go-bench.txt
            echo '```'
            for part in numbers check; do
              if [ -f "build/bench/$part.md" ]; then
                echo
                echo "## Swift benchmarks: $part"
                echo
                cat "build/bench/$part.md"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # A failed check offers new thresholds from a second run, for a change that is slower on purpose.
      - name: Write new thresholds
        if: ${{ failure() }}
        run: mise run bench:swift update --no-progress
      - name: Upload the new thresholds
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thresholds
          path: Benchmarks/Thresholds
          if-no-files-found: error
