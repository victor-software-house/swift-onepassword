name: Benchmarks

# Times the Go shim and the Swift module on GitHub-hosted macOS runners, in two parallel jobs.
# Each job posts its numbers in the job summary.
# The Swift job fails when a benchmark is worse than its threshold in Benchmarks/Thresholds.
# A benchmark that is better passes.
#
# The thresholds are the p90 of the allocation counts, leaked bytes and resident peak on this
# runner type.
# The times on a shared runner change too much between runs to set a threshold, so they are only
# printed.
# Each Swift benchmark runs once.
#
# A failed check, or a manual run, writes new thresholds from that run.
# They are uploaded as the thresholds artifact.
# Commit them under Benchmarks/Thresholds when a change makes a benchmark slower on purpose.
#
# Every run restores the caches.
# A run on main saves them.
# A pull request then reads the caches of main.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - core/**
      - Sources/**
      - Package.swift
      - Benchmarks/**
      - Tests/OnePasswordTests/Fixtures/**
      - mise-tasks/bench/**
      - .github/workflows/bench.yml
  push:
    branches: [main]
    paths:
      - core/**
      - Sources/**
      - Package.swift
      - Benchmarks/**
      - Tests/OnePasswordTests/Fixtures/**
      - mise-tasks/bench/**
      - .github/workflows/bench.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # .miserc.toml loads the dev profile, the git hooks and their scanners, for local work only.
  MISE_ENV: ci

concurrency:
  # One run per pull request: a new push cancels the run it replaces.
  group: bench-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  go:
    if: ${{ !github.event.pull_request.draft }}
    name: Go benchmarks (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          # mise.toml's min_version; the action otherwise takes the newest release older than 24 h.
          version: 2026.11.12
      - id: xcode
        run: |
          xcodebuild -version
          echo "build=$(xcodebuild -version | sed -n 's/^Build version //p')" >> "$GITHUB_OUTPUT"
      # The module cache stores the downloaded modules.
      # The build cache stores the compiled packages.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: go-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('core/go.sum') }}
      - name: Run the Go benchmarks
        shell: bash
        run: mise run bench:go | tee go-bench.txt
      - if: ${{ github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Post the numbers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            echo '## Go benchmarks'
            echo
            echo '```text'
            cat go-bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  swift:
    if: ${{ !github.event.pull_request.draft }}
    name: Swift benchmarks (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.11.12
      - id: xcode
        run: |
          xcodebuild -version
          echo "build=$(xcodebuild -version | sed -n 's/^Build version //p')" >> "$GITHUB_OUTPUT"
      # Benchmarks/.build contains the package checkouts, the core binary and the release builds.
      # SwiftPM's shared cache stores the clones it fetches from.
      - id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Benchmarks/.build
            ~/Library/Caches/org.swift.swiftpm
          key: swiftpm-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode.outputs.build }}-${{ hashFiles('Package.swift', 'Benchmarks/Package.swift', 'Benchmarks/Package.resolved') }}
      - name: Run the Swift benchmarks
        run: mise run bench:swift check
      - if: ${{ github.ref == 'refs/heads/main' && steps.cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            Benchmarks/.build
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ steps.cache.outputs.cache-primary-key }}
      - name: Post the numbers
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          {
            for part in numbers check; do
              if [ -f "build/bench/$part.md" ]; then
                echo "## Swift benchmarks: $part"
                echo
                cat "build/bench/$part.md"
                echo
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      # A failed check, and a manual run, write new thresholds from the run's baseline.
      - name: Write new thresholds
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        run: mise run bench:swift update
      - name: Upload the new thresholds
        if: ${{ failure() || github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: thresholds
          path: Benchmarks/Thresholds
          if-no-files-found: error
