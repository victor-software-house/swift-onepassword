name: Core

# The binary under the package is versioned by the content of core/. This workflow builds the
# XCFramework from core/ and attaches it to a prerelease named core- and the first 12 hex digits
# of the git tree hash of core/, unless that release already holds it. Package.swift names the
# release; `mise run core:pin` points it at the release this workflow published.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - core/**
      - mise-tasks/core/**
      - .github/workflows/core.yml
  workflow_dispatch:

permissions: {}

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # .miserc.toml loads the dev profile, the git hooks and their scanners, for local work only.
  MISE_ENV: ci

concurrency:
  # A run cancelled during the upload leaves a release without the zip, which the next run deletes
  # and makes again.
  group: core-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  core:
    if: ${{ !github.event.pull_request.draft }}
    name: Core binary (macOS)
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write # creates the core release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
        with:
          version: 2026.11.6
          # The job uploads a release asset, so no cache entry may reach it.
          cache: false
      - run: xcodebuild -version
      - id: tag
        run: echo "tag=$(mise run --quiet core:tag)" >> "$GITHUB_OUTPUT"
      # A release without the zip is left from a run that stopped during the upload; it is
      # deleted with its tag and made again.
      - id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          if ! assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' 2> /dev/null); then
            echo "state=none" >> "$GITHUB_OUTPUT"
          elif printf '%s\n' "$assets" | grep -qx COnePassword.xcframework.zip; then
            echo "state=complete" >> "$GITHUB_OUTPUT"
          else
            gh release delete "$TAG" --cleanup-tag --yes
            echo "state=none" >> "$GITHUB_OUTPUT"
          fi
      # core:measure builds first.
      - if: steps.existing.outputs.state == 'none'
        run: mise run core:measure
      - if: steps.existing.outputs.state == 'none'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          size=$(cat build/core/size.txt)
          {
            echo "The binary built from core/ at git tree $(git rev-parse HEAD:core)."
            echo
            echo "- XCFramework zip: $size bytes ($((size / 1048576)) MiB)"
            echo "- Checksum: $(cat build/core/checksum.txt)"
            echo "- First client start-up, one \`op_client_open\` with a malformed token: $(cat build/core/startup-ms.txt) ms"
            echo "- Peak resident size of that process: $(cat build/core/peak-rss-mib.txt) MiB"
            echo "- Built with $(go version) and $(xcodebuild -version | head -n 1) on $ImageOS ($ImageVersion)"
          } > build/core/notes.md
          gh release create "$TAG" build/core/COnePassword.xcframework.zip \
            --prerelease --target "$SHA" --title "$TAG" --notes-file build/core/notes.md
